<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 أهم 50 سهم مصري - تحليل ذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>
    <script src="shared-analysis.js"></script>
    <script>
        if (typeof window.openStockAnalysis !== 'function') {
            window.openStockAnalysis = function(symbol) {
                alert(`تعذر فتح تحليل السهم ${symbol}.\nتأكد من تحميل الصفحة بالكامل ثم حاول مرة أخرى.`);
            };
        }
    </script>
    <script src="global-sidebar.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; padding: 15px; color: #e2e8f0; }
        .container { max-width: 1300px; margin: 0 auto; background: #1e293b; border-radius: 20px; overflow: hidden; border: 1px solid #334155; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
        .header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 18px 22px; border-bottom: 1px solid #334155; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap: wrap; }
        .header h2 { color: #fbbf24; display:flex; gap:10px; align-items:center; }
        .btn { border:none; border-radius:50px; padding:10px 16px; cursor:pointer; font-weight:700; display:inline-flex; gap:8px; align-items:center; }
        .btn-primary { background: linear-gradient(135deg, #fbbf24, #f59e0b); color:#0f172a; }
        .btn-info { background: linear-gradient(135deg, #3b82f6, #2563eb); color:#fff; }
        .meta { padding: 12px 22px; background:#0f172a; border-bottom: 1px solid #334155; color:#94a3b8; }
        .table-wrap { padding: 15px; overflow-x:auto; background:#0f172a; }
        table { width: 100%; border-collapse: collapse; }
        th { background: linear-gradient(135deg, #10b981, #059669); color: #fff; padding: 11px; text-align:center; }
        th.sortable { cursor: pointer; user-select: none; }
        .sort-ind { margin-right: 4px; font-size:.85em; opacity:.9; }
        td { border-bottom:1px solid #334155; padding: 10px; text-align:center; }
        tr:hover { background:#334155; }
        .up { color:#10b981; font-weight:bold; }
        .down { color:#ef4444; font-weight:bold; }
        .badge { padding:4px 10px; border-radius:40px; font-size:.82em; font-weight:700; display:inline-block; }
        .strong { background:#059669; color:#fff; }
        .buy { background:#2563eb; color:#fff; }
        .neutral { background:#6b7280; color:#fff; }
        .empty { margin: 20px; padding: 24px; text-align:center; border:1px dashed #fbbf24; border-radius: 12px; color:#fbbf24; background: rgba(251,191,36,.08); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2><i class="fas fa-trophy"></i> أهم 50 سهم مصري - تحليل ذكي</h2>
            <div>
                <button class="btn btn-info" onclick="window.location.href='../index.html'"><i class="fas fa-arrow-right"></i> الرئيسية</button>
                <button class="btn btn-primary" onclick="loadTop50()"><i class="fas fa-sync-alt"></i> تحديث</button>
            </div>
        </div>

        <div class="meta" id="metaInfo">جاري التحميل...</div>

        <div id="noData" class="empty" style="display:none;">
            <h3>⚠️ لا توجد بيانات</h3>
            <p>ارجع إلى الصفحة الرئيسية وارفع ملف JSON أولًا.</p>
        </div>

        <div class="table-wrap">
            <table id="top50Table" style="display:none;">
                <thead>
                    <tr>
                        <th>#</th>
                        <th class="sortable" data-key="symbol" onclick="sortBy('symbol')">الرمز <span class="sort-ind">↕</span></th>
                        <th class="sortable" data-key="name" onclick="sortBy('name')">الشركة <span class="sort-ind">↕</span></th>
                        <th class="sortable" data-key="currentPrice" onclick="sortBy('currentPrice')">السعر الحالي <span class="sort-ind">↕</span></th>
                        <th class="sortable" data-key="nearLowPct" onclick="sortBy('nearLowPct')">قرب الحد الأدنى % <span class="sort-ind">↕</span></th>
                        <th class="sortable" data-key="nearSupportPct" onclick="sortBy('nearSupportPct')">قرب الدعم % <span class="sort-ind">↕</span></th>
                        <th class="sortable" data-key="rsi" onclick="sortBy('rsi')">RSI <span class="sort-ind">↕</span></th>
                        <th class="sortable" data-key="macdText" onclick="sortBy('macdText')">MACD <span class="sort-ind">↕</span></th>
                        <th class="sortable" data-key="score" onclick="sortBy('score')">الدرجة <span class="sort-ind">↕</span></th>
                        <th>الترشيح</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let rankedRows = [];
        let sortState = { key: 'score', dir: 'desc' };

        function recommendationLabel(score) {
            if (score >= 8) return '<span class="badge strong">مرشح قوي</span>';
            if (score >= 6) return '<span class="badge buy">مرشح جيد</span>';
            return '<span class="badge neutral">متابعة</span>';
        }

        function sortBy(key) {
            if (sortState.key === key) {
                sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
            } else {
                sortState.key = key;
                sortState.dir = (key === 'name' || key === 'symbol' || key === 'macdText') ? 'asc' : 'desc';
            }
            renderTableRows();
        }

        function compareValues(a, b, key, dir) {
            const va = a?.[key];
            const vb = b?.[key];
            const bothNumeric = Number.isFinite(Number(va)) && Number.isFinite(Number(vb));
            const cmp = bothNumeric
                ? (Number(va) - Number(vb))
                : String(va ?? '').localeCompare(String(vb ?? ''), 'ar');
            return dir === 'asc' ? cmp : -cmp;
        }

        function renderTableRows() {
            const body = document.getElementById('tableBody');
            const meta = document.getElementById('metaInfo');
            if (!body) return;

            const sorted = [...rankedRows].sort((a, b) => compareValues(a, b, sortState.key, sortState.dir));

            body.innerHTML = sorted.map((s, i) => {
                const nearLowCls = s.nearLowPct <= 5 ? 'up' : 'down';
                const nearSupportCls = (s.nearSupportPct >= -2 && s.nearSupportPct <= 5) ? 'up' : 'down';
                const rsiCls = Number.isFinite(s.rsi) && s.rsi <= 35 ? 'up' : '';
                return `
                    <tr onclick="openStockAnalysis('${s.symbol}')" style="cursor:pointer;">
                        <td>${i + 1}</td>
                        <td style="color:#fbbf24;font-weight:700;">${s.symbol}</td>
                        <td>${s.name}</td>
                        <td>${(s.currentPrice || 0).toFixed(2)}</td>
                        <td class="${nearLowCls}">${s.nearLowPct.toFixed(2)}%</td>
                        <td class="${nearSupportCls}">${s.nearSupportPct.toFixed(2)}%</td>
                        <td class="${rsiCls}">${Number.isFinite(s.rsi) ? s.rsi.toFixed(1) : '-'}</td>
                        <td>${s.macdText}</td>
                        <td class="up">${s.score.toFixed(1)}</td>
                        <td>${recommendationLabel(s.score)}</td>
                    </tr>
                `;
            }).join('');

            const labels = {
                symbol: 'الرمز',
                name: 'الشركة',
                currentPrice: 'السعر الحالي',
                nearLowPct: 'قرب الحد الأدنى',
                nearSupportPct: 'قرب الدعم',
                rsi: 'RSI',
                macdText: 'MACD',
                score: 'الدرجة'
            };
            const dirText = sortState.dir === 'asc' ? 'تصاعدي' : 'تنازلي';
            if (meta) {
                meta.textContent = `تم عرض ${sorted.length} سهم | الترتيب: ${labels[sortState.key] || sortState.key} (${dirText}) | شرط البيانات: 40 يوم على الأقل`;
            }

            document.querySelectorAll('th.sortable').forEach(th => {
                const key = th.getAttribute('data-key');
                const ind = th.querySelector('.sort-ind');
                if (!ind) return;
                if (key === sortState.key) ind.textContent = sortState.dir === 'asc' ? '▲' : '▼';
                else ind.textContent = '↕';
            });
        }

        function toNum(value) {
            const n = Number(value);
            return Number.isFinite(n) ? n : null;
        }

                function parseDate(dateStr) {
            if (!dateStr) return new Date(0);
            
            let clean = String(dateStr).trim().replace(/^['"]|['"]$/g, '');
            if (!clean) return new Date(0);

            if (clean.includes('T')) {
                const d = new Date(clean);
                if (!isNaN(d.getTime())) return d;
            }

            let parts = clean.split(/[-/. ]+/);
            if (parts.length === 3) {
                let p0 = parseInt(parts[0], 10);
                let p1 = parseInt(parts[1], 10);
                let p2 = parseInt(parts[2], 10);

                if (!isNaN(p0) && !isNaN(p1) && !isNaN(p2)) {
                    let year = -1;
                    let month = -1;
                    let day = -1;

                    if (parts[0].length === 4 || p0 > 31) {
                        year = p0;
                        if (p1 > 12) {
                            day = p1;
                            month = p2 - 1;
                        } else {
                            month = p1 - 1;
                            day = p2;
                        }
                    } else if (parts[2].length === 4 || p2 > 31) {
                        year = p2;
                        if (p0 > 12) {
                            day = p0;
                            month = p1 - 1;
                        } else if (p1 > 12) {
                            month = p0 - 1;
                            day = p1;
                        } else {
                            day = p0;
                            month = p1 - 1;
                        }
                    } else {
                        day = p0;
                        month = p1 - 1;
                        year = p2 + 2000;
                    }

                    if (year > 0 && month >= 0 && month < 12 && day > 0 && day <= 31) {
                        return new Date(year, month, day);
                    }
                }
            }

            const d = new Date(clean);
            return isNaN(d.getTime()) ? new Date(0) : d;
        }

        function readCompanies() {
            const raw = sessionStorage.getItem('stocksData') || localStorage.getItem('stocksData');
            if (!raw) return [];
            try {
                const data = JSON.parse(raw);
                const source = data.companies || data;
                if (Array.isArray(source)) return source;
                if (source && typeof source === 'object') return Object.values(source);
            } catch {
            }
            return [];
        }

        function getProcessedMap() {
            const raw = sessionStorage.getItem('processedData') || localStorage.getItem('processedData');
            if (!raw) return new Map();
            try {
                const rows = JSON.parse(raw) || [];
                return new Map(rows.map(r => [String(r.symbol || '').toUpperCase(), r]));
            } catch {
                return new Map();
            }
        }

        function historyPoints(company) {
            const rows = company?.historical || company?.daily || [];
            return rows.map(row => ({
                date: row?.date,
                close: toNum(row?.close ?? row?.price ?? row?.value),
                low: toNum(row?.low ?? row?.min ?? row?.close ?? row?.price)
            }))
            .filter(p => p.date && Number.isFinite(p.close))
            .sort((a, b) => parseDate(a.date) - parseDate(b.date));
        }

        function calcRSI(values, period = 14) {
            if (!Array.isArray(values) || values.length <= period) return null;
            let gains = 0;
            let losses = 0;
            for (let i = values.length - period; i < values.length; i++) {
                const prev = values[i - 1];
                const curr = values[i];
                const diff = curr - prev;
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }
            const avgGain = gains / period;
            const avgLoss = losses / period;
            if (avgLoss === 0 && avgGain === 0) return 50;
            if (avgLoss === 0) return 70;
            const rs = avgGain / avgLoss;
            return 100 - (100 / (1 + rs));
        }

        function calcEMA(values, period) {
            if (!Array.isArray(values) || !values.length) return [];
            const k = 2 / (period + 1);
            const out = [];
            let ema = values[0];
            out.push(ema);
            for (let i = 1; i < values.length; i++) {
                ema = values[i] * k + ema * (1 - k);
                out.push(ema);
            }
            return out;
        }

        function calcMACD(values) {
            if (!Array.isArray(values) || values.length < 26) return null;
            const ema12 = calcEMA(values, 12);
            const ema26 = calcEMA(values, 26);
            const macd = values.map((_, i) => ema12[i] - ema26[i]);
            const signal = calcEMA(macd, 9);
            const hist = macd.map((m, i) => m - signal[i]);
            const last = macd.length - 1;
            if (last < 2) return null;
            return {
                macd: macd[last],
                signal: signal[last],
                hist: hist[last],
                prevHist: hist[last - 1],
                prev2Hist: hist[last - 2]
            };
        }

        function macdState(m) {
            if (!m) return { text: 'غير متاح', score: 0 };

            const weakeningSell = m.hist < 0 && m.hist > m.prevHist && m.prevHist > m.prev2Hist;
            const nearBullishCross = m.macd < m.signal && Math.abs(m.macd - m.signal) <= Math.max(Math.abs(m.signal) * 0.08, 0.02);
            const bullishCross = m.macd >= m.signal && m.hist > 0;

            if (bullishCross) return { text: 'تقاطع صاعد', score: 3 };
            if (weakeningSell && nearBullishCross) return { text: 'ضعف بيع + قرب صعود', score: 3 };
            if (weakeningSell) return { text: 'ضعف بيع', score: 2 };
            if (nearBullishCross) return { text: 'قرب تقاطع صاعد', score: 2 };
            return { text: 'محايد/هابط', score: 0 };
        }

        function loadTop50() {
            const noData = document.getElementById('noData');
            const table = document.getElementById('top50Table');
            const body = document.getElementById('tableBody');
            const meta = document.getElementById('metaInfo');
            const companies = readCompanies();
            const processedMap = getProcessedMap();

            if (!companies.length) {
                const processedRows = Array.from(processedMap.values()).filter(row => String(row?.symbol || '').trim() !== '');
                if (processedRows.length) {
                    const rankedFromProcessed = processedRows.map(row => {
                        const symbol = String(row.symbol || '').toUpperCase();
                        const rsi = Number(row.rsi);
                        const rec = String(row.recommendation || '').toLowerCase();
                        let score = rec === 'strong-buy' ? 4 : rec === 'buy' ? 3 : 1;

                        if (Number.isFinite(rsi)) {
                            if (rsi <= 35) score += 1;
                            else if (rsi >= 70) score -= 1;
                        }

                        return {
                            symbol,
                            name: row.name || row.longName || row.shortName || symbol,
                            currentPrice: Number(row.currentPrice || 0),
                            nearLowPct: 0,
                            nearSupportPct: 0,
                            rsi,
                            macdText: 'من processedData',
                            score
                        };
                    })
                    .sort((a, b) => b.score - a.score)
                    .slice(0, 50);

                    rankedRows = rankedFromProcessed;
                    noData.style.display = 'none';
                    table.style.display = 'table';
                    renderTableRows();
                    meta.textContent = `تم عرض ${rankedFromProcessed.length} سهم من processedData (وضع الاسترجاع)`;
                    return;
                }

                noData.style.display = 'block';
                table.style.display = 'none';
                meta.textContent = 'لا توجد بيانات أسهم في الجلسة الحالية';
                return;
            }

            const ranked = companies.map(company => {
                const symbol = String(company.symbol || '').toUpperCase();
                const points = historyPoints(company);
                if (points.length < 40) return null;

                const closes = points.map(p => p.close);
                const latest = closes[closes.length - 1];
                const recent40 = points.slice(-40);
                const min40 = Math.min(...recent40.map(p => p.low ?? p.close).filter(Number.isFinite));

                const processed = processedMap.get(symbol) || {};
                const supportArr = Array.isArray(processed.support) ? processed.support.map(Number).filter(Number.isFinite) : [];
                const support = supportArr.length ? supportArr[0] : Math.min(...points.slice(-30).map(p => p.low ?? p.close).filter(Number.isFinite));

                const nearLowPct = min40 > 0 ? ((latest - min40) / min40) * 100 : 999;
                const nearSupportPct = support > 0 ? ((latest - support) / support) * 100 : 999;
                const rsi = Number.isFinite(Number(processed.rsi)) ? Number(processed.rsi) : calcRSI(closes, 14);
                const macd = calcMACD(closes);
                const macdRead = macdState(macd);

                let score = 0;

                if (nearLowPct <= 2) score += 3;
                else if (nearLowPct <= 5) score += 2;
                else if (nearLowPct <= 8) score += 1;

                if (nearSupportPct >= -2 && nearSupportPct <= 2) score += 3;
                else if (nearSupportPct > 2 && nearSupportPct <= 5) score += 2;
                else if (nearSupportPct > 5 && nearSupportPct <= 8) score += 1;

                if (Number.isFinite(rsi)) {
                    if (rsi <= 30) score += 3;
                    else if (rsi <= 35) score += 2;
                    else if (rsi <= 40) score += 1;
                }

                score += macdRead.score;

                return {
                    symbol,
                    name: company.longName || company.shortName || symbol,
                    currentPrice: latest,
                    nearLowPct,
                    nearSupportPct,
                    rsi,
                    macdText: macdRead.text,
                    score
                };
            }).filter(Boolean)
            .sort((a, b) => b.score - a.score)
            .slice(0, 50);

            if (!ranked.length) {
                noData.style.display = 'block';
                table.style.display = 'none';
                meta.textContent = 'لا توجد أسهم مطابقة للمعايير حالياً';
                return;
            }

            rankedRows = ranked;
            renderTableRows();

            noData.style.display = 'none';
            table.style.display = 'table';
            meta.textContent = `تم عرض ${ranked.length} سهم (شرط البيانات: 40 يوم على الأقل)`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.__stockDataRestorePromise) {
                try { await window.__stockDataRestorePromise; } catch {}
            }
            loadTop50();
        });
    </script>
</body>
</html>
