<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔨 شمعة الهامر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>
    <script src="shared-analysis.js"></script>
    <script>
        if (typeof window.openStockAnalysis !== 'function') {
            window.openStockAnalysis = function(symbol) {
                alert(`تعذر فتح تحليل السهم ${symbol}.\nتأكد من تحميل الصفحة بالكامل ثم حاول مرة أخرى.`);
            };
        }
    </script>
    <script src="global-sidebar.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; padding: 15px; color: #e2e8f0; }
        .container { max-width: 1300px; margin: 0 auto; background: #1e293b; border-radius: 20px; overflow: hidden; border: 1px solid #334155; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
        .header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 18px 22px; border-bottom: 1px solid #334155; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap: wrap; }
        .header h2 { color: #fbbf24; display:flex; gap:10px; align-items:center; }
        .btn { border:none; border-radius:50px; padding:10px 16px; cursor:pointer; font-weight:700; display:inline-flex; gap:8px; align-items:center; }
        .btn-primary { background: linear-gradient(135deg, #fbbf24, #f59e0b); color:#0f172a; }
        .btn-info { background: linear-gradient(135deg, #3b82f6, #2563eb); color:#fff; }
        .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .day-select { min-width: 260px; padding: 9px 10px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-weight: 700; }
        .days-label { color: #cbd5e1; font-size: 14px; }
        .note { margin: 12px 20px; padding: 12px; border-radius: 8px; border-right: 3px solid #f59e0b; background: rgba(245,158,11,.1); color: #fbbf24; }
        .meta { padding: 0 22px 12px; color:#94a3b8; }
        .table-wrap { padding: 15px; overflow-x:auto; background:#0f172a; }
        table { width: 100%; border-collapse: collapse; }
        th { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; padding: 11px; text-align:center; }
        td { border-bottom:1px solid #334155; padding: 10px; text-align:center; }
        tr:hover { background:#334155; }
        .up { color:#10b981; font-weight:bold; }
        .warn { color:#f59e0b; font-weight:bold; }
        .mid  { color:#94a3b8; }
        .empty { margin: 20px; padding: 24px; text-align:center; border:1px dashed #fbbf24; border-radius: 12px; color:#fbbf24; background: rgba(251,191,36,.08); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2><i class="fas fa-hammer"></i> شمعة الهامر</h2>
            <div class="controls">
                <span class="days-label">يوم التحليل:</span>
                <select id="analysisDay" class="day-select"></select>
                <button class="btn btn-primary" onclick="updateTable()"><i class="fas fa-sync-alt"></i> تحديث</button>
                <button class="btn btn-info" onclick="window.location.href='../index.html'"><i class="fas fa-arrow-right"></i> الرئيسية</button>
            </div>
        </div>

        <div class="note" id="hammerNote">
            جاري تحديد نوع البيانات المتاحة...
        </div>

        <div class="meta" id="metaInfo">جاري التحميل...</div>

        <div id="noData" class="empty" style="display:none;">
            <h3>⚠️ لا توجد إشارات هامر حالياً</h3>
            <p>تأكد من رفع البيانات أو جرّب لاحقًا.</p>
        </div>

        <div class="table-wrap">
            <table id="hammerTable" style="display:none;">
                <thead>
                    <tr>
                        <th>الرمز</th>
                        <th>الشركة</th>
                        <th>السعر الحالي</th>
                        <th>قاع الإشارة</th>
                        <th>الارتداد من القاع %</th>
                        <th>دعم تاريخي</th>
                        <th>مسافة الذيل من الدعم %</th>
                        <th>ملاحظة</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        function readStocksData() {
            const raw = sessionStorage.getItem('stocksData') || localStorage.getItem('stocksData');
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    const source = data.companies || data;
                    if (Array.isArray(source)) return source;
                    if (source && typeof source === 'object') return Object.values(source);
                } catch {}
            }

            const processedRaw = sessionStorage.getItem('processedData') || localStorage.getItem('processedData');
            if (!processedRaw) return [];
            try {
                const rows = JSON.parse(processedRaw);
                if (!Array.isArray(rows)) return [];
                return rows.map(row => ({
                    symbol: row?.symbol,
                    shortName: row?.name || row?.symbol,
                    longName: row?.name || row?.symbol,
                    historical: []
                }));
            } catch {
                return [];
            }
        }

        function toNumber(value) {
            const num = Number(value);
            return Number.isFinite(num) ? num : null;
        }

                function parseDate(dateStr) {
            if (!dateStr) return new Date(0);
            
            let clean = String(dateStr).trim().replace(/^['"]|['"]$/g, '');
            if (!clean) return new Date(0);

            if (clean.includes('T')) {
                const d = new Date(clean);
                if (!isNaN(d.getTime())) return d;
            }

            let parts = clean.split(/[-/. ]+/);
            if (parts.length === 3) {
                let p0 = parseInt(parts[0], 10);
                let p1 = parseInt(parts[1], 10);
                let p2 = parseInt(parts[2], 10);

                if (!isNaN(p0) && !isNaN(p1) && !isNaN(p2)) {
                    let year = -1;
                    let month = -1;
                    let day = -1;

                    if (parts[0].length === 4 || p0 > 31) {
                        year = p0;
                        if (p1 > 12) {
                            day = p1;
                            month = p2 - 1;
                        } else {
                            month = p1 - 1;
                            day = p2;
                        }
                    } else if (parts[2].length === 4 || p2 > 31) {
                        year = p2;
                        if (p0 > 12) {
                            day = p0;
                            month = p1 - 1;
                        } else if (p1 > 12) {
                            month = p0 - 1;
                            day = p1;
                        } else {
                            day = p0;
                            month = p1 - 1;
                        }
                    } else {
                        day = p0;
                        month = p1 - 1;
                        year = p2 + 2000;
                    }

                    if (year > 0 && month >= 0 && month < 12 && day > 0 && day <= 31) {
                        return new Date(year, month, day);
                    }
                }
            }

            const d = new Date(clean);
            return isNaN(d.getTime()) ? new Date(0) : d;
        }

        function toDateKey(dateInput) {
            const d = dateInput instanceof Date ? dateInput : parseDate(dateInput);
            if (!d) return '';
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function formatArabicDate(dateInput) {
            const d = dateInput instanceof Date ? dateInput : parseDate(dateInput);
            if (!d) return '-';
            return d.toLocaleDateString('ar-EG');
        }

        function pickFirst(row, keys) {
            for (const key of keys) {
                if (row && row[key] !== undefined && row[key] !== null && row[key] !== '') {
                    return row[key];
                }
            }
            return null;
        }

        function getSeries(company) {
            const rows = company.historical || company.daily || [];
            return rows
                .map(x => Number(x.close ?? x.price ?? x.value))
                .filter(x => Number.isFinite(x));
        }

        function getCandles(company) {
            const rows = company.historical || company.daily || [];
            return rows.map(row => {
                const dateRaw = pickFirst(row, ['date', 'Date', 'التاريخ']);
                const dateObj = parseDate(dateRaw);
                const close = toNumber(pickFirst(row, ['close', 'Close', 'price', 'value', 'last', 'lastPrice', 'آخر سعر', 'الاغلاق', 'الإغلاق']));
                const open = toNumber(pickFirst(row, ['open', 'Open', 'افتتاح', 'سعر الافتتاح']));
                const high = toNumber(pickFirst(row, ['high', 'High', 'max', 'أعلى', 'اعلى', 'highest']));
                const low = toNumber(pickFirst(row, ['low', 'Low', 'min', 'أدنى', 'ادنى', 'lowest']));
                return {
                    date: dateRaw,
                    dateObj,
                    dateKey: toDateKey(dateObj),
                    open,
                    high,
                    low,
                    close
                };
            }).filter(c => Number.isFinite(c.close) && c.dateObj).sort((a, b) => a.dateObj - b.dateObj);
        }

        function collectTradingDates(stocks) {
            const map = new Map();
            stocks.forEach(company => {
                const candles = getCandles(company);
                candles.forEach(c => {
                    if (c.dateKey && !map.has(c.dateKey)) {
                        map.set(c.dateKey, c.dateObj);
                    }
                });
            });
            return Array.from(map.entries())
                .sort((a, b) => a[1] - b[1])
                .map(([key, dateObj]) => ({ key, dateObj }));
        }

        function populateAnalysisDaySelect(stocks) {
            const select = document.getElementById('analysisDay');
            if (!select) return { selectedDateKey: '', selectedDateLabel: '-' };

            const dates = collectTradingDates(stocks);
            if (!dates.length) {
                select.innerHTML = '';
                return { selectedDateKey: '', selectedDateLabel: '-' };
            }

            const last = dates[dates.length - 1];
            const prev = dates.length >= 2 ? dates[dates.length - 2] : null;

            const previousValue = select.value;
            const options = [];
            options.push({ value: last.key, label: `آخر يوم تداول (${formatArabicDate(last.dateObj)})` });
            if (prev) {
                options.push({ value: prev.key, label: `قبل آخر يوم تداول (${formatArabicDate(prev.dateObj)})` });
            }

            select.innerHTML = options.map(option => `<option value="${option.value}">${option.label}</option>`).join('');

            const stillExists = options.some(option => option.value === previousValue);
            select.value = stillExists ? previousValue : options[0].value;

            const selected = dates.find(d => d.key === select.value) || last;
            return {
                selectedDateKey: selected.key,
                selectedDateLabel: formatArabicDate(selected.dateObj)
            };
        }

        /**
         * findHistoricalSupport — يعثر على أقرب مستوى دعم تاريخي أقل من أو يساوي سعر الذيل السفلي.
         * يبحث في آخر 90 شمعة عن قيعان محلية (local troughs).
         */
        function findHistoricalSupport(candles, wickLow) {
            if (!candles || candles.length < 5 || !Number.isFinite(wickLow)) return null;
            const window = candles.slice(-Math.min(90, candles.length - 1)); // exclude the last candle
            const supports = [];

            for (let i = 2; i < window.length - 2; i++) {
                const low = Number(window[i].low ?? window[i].close);
                if (!Number.isFinite(low)) continue;
                const prev1 = Number(window[i - 1].low ?? window[i - 1].close);
                const prev2 = Number(window[i - 2].low ?? window[i - 2].close);
                const next1 = Number(window[i + 1].low ?? window[i + 1].close);
                const next2 = Number(window[i + 2].low ?? window[i + 2].close);
                if (low <= prev1 && low <= prev2 && low <= next1 && low <= next2) {
                    supports.push(low);
                }
            }

            if (!supports.length) return null;

            // أقرب دعم أقل من أو يساوي wickLow
            const candidates = supports.filter(s => s <= wickLow * 1.02); // سماح 2% فوق القاع
            if (!candidates.length) return null;
            return Math.max(...candidates); // أعلى قيمة (= الأقرب للسعر)
        }

        function detectHammerSingleDay(candle) {
            if (!candle) return null;
            const close = Number(candle.close);
            if (!Number.isFinite(close)) return null;

            let open = Number(candle.open);
            let high = Number(candle.high);
            let low = Number(candle.low);

            const hasRawOHLC = Number.isFinite(open) && Number.isFinite(high) && Number.isFinite(low);

            if (!Number.isFinite(open)) open = close;
            if (!Number.isFinite(high)) high = Math.max(close, open);
            if (!Number.isFinite(low)) low = Math.min(close, open);

            const bodySize = Math.abs(close - open);
            const bodySizePercent = close > 0 ? (bodySize / close) * 100 : 0;
            const lowerWick = Math.min(open, close) - low;
            const upperWick = high - Math.max(open, close);

            const isBodySmall = bodySizePercent < 2;
            const isLowerWickLong = lowerWick > (bodySize * 3);
            const isUpperWickSmall = upperWick < (lowerWick * 0.2) || upperWick === 0;

            if (!(isBodySmall && isLowerWickLong && isUpperWickSmall)) return null;

            const rebound = low > 0 ? ((close - low) / low) * 100 : 0;
            const wickRatio = lowerWick / Math.max(bodySize, 0.01);

            return {
                low,
                close,
                rebound,
                note: hasRawOHLC
                    ? `هامر حقيقي من نفس يوم التداول (${wickRatio.toFixed(1)}x)`
                    : `هامر مشتق من نفس اليوم فقط (${wickRatio.toFixed(1)}x)`,
                mode: hasRawOHLC ? 'raw' : 'derived'
            };
        }

        function updateTable() {
            const stocks = readStocksData();
            const body = document.getElementById('tableBody');
            const table = document.getElementById('hammerTable');
            const noData = document.getElementById('noData');
            const meta = document.getElementById('metaInfo');
            const note = document.getElementById('hammerNote');

            const { selectedDateKey, selectedDateLabel } = populateAnalysisDaySelect(stocks);
            if (!selectedDateKey) {
                note.textContent = 'لا توجد تواريخ تداول صالحة داخل البيانات الحالية.';
                noData.style.display = 'block';
                table.style.display = 'none';
                meta.textContent = 'تعذر تحديد يوم التحليل';
                return;
            }

            const rows = [];
            let rawCount = 0;
            let derivedCount = 0;
            let supportFiltered = 0;

            stocks.forEach(company => {
                const candles = getCandles(company);
                const selectedCandle = candles.find(c => c.dateKey === selectedDateKey);
                const hit = detectHammerSingleDay(selectedCandle);
                if (!hit) return;

                // شرط الموقع: الذيل السفلي يجب أن يلمس مستوى دعم تاريخي
                const historicalCandles = candles.filter(c => c.dateKey !== selectedDateKey);
                const historicalSupport = findHistoricalSupport(historicalCandles, hit.low);

                if (historicalSupport === null) {
                    supportFiltered++;
                    return; // لا يوجد دعم تاريخي = إشارة وهمية
                }

                const distanceToPct = historicalSupport > 0
                    ? ((hit.low - historicalSupport) / historicalSupport) * 100
                    : 0;

                if (hit.mode === 'raw') rawCount++; else derivedCount++;

                rows.push({
                    symbol: company.symbol || '-',
                    name: company.longName || company.shortName || (company.symbol || '-'),
                    current: hit.close,
                    low: hit.low,
                    rebound: hit.rebound,
                    historicalSupport,
                    distanceToPct,
                    note: hit.note
                });
            });

            rows.sort((a, b) => b.rebound - a.rebound);

            if (!rows.length) {
                note.textContent = `لا توجد إشارات هامر مطابقة في يوم ${selectedDateLabel}${supportFiltered ? ` (تم تصفية ${supportFiltered} إشارة بسبب غياب دعم تاريخي)` : ''}.`;
                noData.style.display = 'block';
                table.style.display = 'none';
                meta.textContent = `لا توجد إشارات مطابقة | يوم التحليل: ${selectedDateLabel}`;
                return;
            }

            if (rawCount > 0 && derivedCount === 0) {
                note.textContent = `تم التحليل ليوم واحد فقط (${selectedDateLabel}) باستخدام OHLC الخام لجميع الإشارات. شرط الدعم التاريخي مفعَّل — تم تصفية ${supportFiltered} إشارة وهمية.`;
            } else {
                note.textContent = `تم التحليل ليوم (${selectedDateLabel}): OHLC خام لعدد ${rawCount} سهم، اشتقاق لعدد ${derivedCount}. تم تصفية ${supportFiltered} إشارة بغياب دعم تاريخي.`;
            }

            body.innerHTML = rows.map(r => `
                <tr onclick="openStockAnalysis('${r.symbol}')" style="cursor:pointer;">
                    <td style="color:#fbbf24;font-weight:700;">${r.symbol}</td>
                    <td>${r.name}</td>
                    <td class="up">${r.current.toFixed(2)}</td>
                    <td class="warn">${r.low.toFixed(2)}</td>
                    <td class="up">${r.rebound.toFixed(2)}%</td>
                    <td class="up">${r.historicalSupport.toFixed(2)}</td>
                    <td class="${r.distanceToPct <= 1 ? 'up' : r.distanceToPct <= 3 ? 'warn' : 'mid'}">${r.distanceToPct.toFixed(2)}%</td>
                    <td>${r.note}</td>
                </tr>
            `).join('');

            noData.style.display = 'none';
            table.style.display = 'table';
            meta.textContent = `عدد الإشارات: ${rows.length} | تم تصفية: ${supportFiltered} (بغياب دعم) | يوم التحليل: ${selectedDateLabel}`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.__stockDataRestorePromise) {
                try { await window.__stockDataRestorePromise; } catch {}
            }
            const analysisDaySelect = document.getElementById('analysisDay');
            if (analysisDaySelect) {
                analysisDaySelect.addEventListener('change', updateTable);
            }

            updateTable();
        });
    </script>
</body>
</html>
