name: EGX Supabase News Auto-Update

on:
  schedule:
    # Runs every 2 hours daily
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allows manual trigger of the workflow from the GitHub Actions tab

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Execute news update script
      run: |
        python Data/update_news_cron.py
