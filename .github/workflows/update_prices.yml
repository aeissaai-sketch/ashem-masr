name: EGX Supabase Price Auto-Update

on:
  schedule:
    # Runs every 5 minutes from 7:00 AM UTC to 12:59 PM UTC (10:00 AM to 3:59 PM Cairo Time), Sunday to Thursday
    - cron: '*/5 7-12 * * 0-4'
  workflow_dispatch:
    # Allows manual trigger of the workflow from the GitHub Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests yfinance pytz

    - name: Execute price update script
      run: |
        python Data/update_prices_cron.py
